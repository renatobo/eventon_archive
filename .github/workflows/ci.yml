name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: PHP ${{ matrix.php }} syntax and assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.3', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint runtime PHP
        run: find . -path './vendor' -prune -o -path './tests' -prune -o -path './.git' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check JavaScript syntax and block metadata
        run: |
          node --check blocks/archive/editor.js
          node --check assets/eventon-archive-counters.js
          python3 -m json.tool blocks/archive/block.json > /dev/null

  quality:
    name: PHPStan and PHPUnit (PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit --locked
      - run: composer check

  ci-required:
    name: ci-required
    if: always()
    needs: [runtime, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results and all(job['result'] == 'success' for job in results.values()), results
          PYTHON
