<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="750" height="210" viewBox="0 0 750 210" fill="none"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="EventON Archive">
  <defs>
    <linearGradient id="archiveBannerBg" x1="0" y1="0" x2="750" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B1F2A"/>
      <stop offset="0.55" stop-color="#8C0F16"/>
      <stop offset="1" stop-color="#E11C24"/>
    </linearGradient>
    <linearGradient id="archiveBannerMark" x1="46" y1="58" x2="150" y2="162" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDEFF2"/>
    </linearGradient>
  </defs>

  <rect width="750" height="210" fill="url(#archiveBannerBg)"/>

  <!-- Archive box and calendar rows. -->
  <g transform="translate(46 55)">
    <rect width="104" height="104" rx="26" fill="url(#archiveBannerMark)"/>
    <rect x="23" y="26" width="58" height="54" rx="5" stroke="#8C0F16" stroke-width="5"/>
    <path d="M23 42 H81 M37 21 V32 M67 21 V32 M36 55 H68 M36 67 H58" stroke="#E11C24" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
    <text x="186" y="86" fill="#FFFFFF" font-size="34" font-weight="700"
          letter-spacing="0.2">EventON Archive</text>
    <text x="186" y="120" fill="#FFE3E5" font-size="16">
      Keep every event within reach.
    </text>
    <text x="186" y="146" fill="#F0B9BD" font-size="14">
      A crawlable history, grouped by year and month.
    </text>
  </g>

  <rect x="0" y="204" width="750" height="6" fill="#E11C24"/>
</svg>
